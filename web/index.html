<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Todos</title>
  <style>
    :root {
      --bg: #f4f5f7;
      --card: #ffffff;
      --text: #1f2328;
      --muted: #6b7280;
      --border: #e5e7eb;
      --accent: #4f46e5;
      --accent-hover: #4338ca;
      --error: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #0f1115;
        --card: #181b21;
        --text: #e6e8eb;
        --muted: #9aa1ac;
        --border: #2a2f37;
        --accent: #818cf8;
        --accent-hover: #a5b4fc;
        --error: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      min-height: 100vh;
      background: var(--bg);
      color: var(--text);
      font: 16px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
      display: flex;
      justify-content: center;
      padding: 48px 16px;
    }
    main {
      width: 100%;
      max-width: 480px;
      background: var(--card);
      border: 1px solid var(--border);
      border-radius: 12px;
      padding: 24px;
      box-shadow: 0 1px 3px rgb(0 0 0 / 0.06);
      align-self: flex-start;
    }
    h1 { margin: 0 0 16px; font-size: 1.5rem; }
    form { display: flex; gap: 8px; }
    input {
      flex: 1;
      min-width: 0;
      padding: 10px 12px;
      font: inherit;
      color: inherit;
      background: transparent;
      border: 1px solid var(--border);
      border-radius: 8px;
    }
    input:focus { outline: 2px solid var(--accent); outline-offset: -1px; }
    button {
      padding: 10px 16px;
      font: inherit;
      font-weight: 600;
      color: #fff;
      background: var(--accent);
      border: 0;
      border-radius: 8px;
      cursor: pointer;
    }
    button:hover { background: var(--accent-hover); }
    .error { min-height: 1.5em; margin: 8px 0 0; color: var(--error); font-size: 0.875rem; }
    ul { list-style: none; margin: 8px 0 0; padding: 0; }
    li {
      padding: 12px 4px;
      border-bottom: 1px solid var(--border);
      overflow-wrap: anywhere;
    }
    li:last-child { border-bottom: 0; }
    li { display: flex; align-items: center; gap: 8px; }
    .todo-text { flex: 1; min-width: 0; }
    button.delete, button.rename {
      padding: 4px 10px;
      font-size: 0.875rem;
      font-weight: 500;
      color: var(--muted);
      background: transparent;
      border: 1px solid var(--border);
    }
    button.delete:hover { color: var(--error); border-color: var(--error); background: transparent; }
    button.rename:hover { color: var(--accent); border-color: var(--accent); background: transparent; }
    .rename-input { padding: 4px 8px; }
    li.done { color: var(--muted); text-decoration: line-through; }
    .count { margin: 8px 0 0; color: var(--muted); font-size: 0.875rem; }
    .empty { margin: 8px 0 0; color: var(--muted); text-align: center; }
  </style>
</head>
<body>
  <main>
    <h1>Todos</h1>
    <form id="add-form" autocomplete="off">
      <input id="todo-input" type="text" placeholder="What needs doing?" aria-label="New todo">
      <button type="submit">Add</button>
    </form>
    <p id="error" class="error" role="alert"></p>
    <ul id="todo-list"></ul>
    <p id="count" class="count" aria-live="polite"></p>
    <p id="empty" class="empty">Nothing to do yet.</p>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
